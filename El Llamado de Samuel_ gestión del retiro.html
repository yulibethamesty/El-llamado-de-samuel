<div class="grid md:grid-cols-2 gap-5 noprint"><form class="g p-5 grid gap-3 h-fit" onsubmit="return A.edNew(event)"><h3 class="h">${ic('plus')}Nueva edición</h3><label class="f">Nombre<input class="in" name="name" required maxlength="80" placeholder="3.ª Edición – …"></label><label class="f">Etiqueta<input class="in" name="tag" maxlength="30" placeholder="3.ª Edición"></label><label class="flex gap-2 items-center"><input type="checkbox" name="inh" checked>Heredar los servicios de esta edición (sin miembros)</label><button class="btn">Crear edición</button></form><div class="g p-5 grid gap-3 h-fit"><h3 class="h">${ic('trash-2')}Eliminar esta edición</h3><p class="mut text-sm">Borra sus servicios, actividades y charlistas. El directorio y las finanzas no se tocan.</p><button type="button" class="btn no" onclick="A.edDel()">Eliminar edición</button></div></div></div>`}
/* --- Servicios --- */
const svcCard=s=>{const pool=SRV().filter(p=>!s.members.includes(p.id));return `<div class="g p-4 grid gap-2 h-fit"><div class="flex items-center gap-2"><input class="in" style="font-weight:700" value="${esc(s.name)}" aria-label="Nombre del servicio" onchange="A.svcSet('${s.id}','name',this.value)"><span class="bd Abonado">${s.members.length}</span><button type="button" class="btn no x noprint" aria-label="Eliminar servicio" onclick="A.svcDel('${s.id}')">${ic('trash-2')}</button></div><input class="in" value="${esc(s.desc)}" placeholder="Descripción breve" aria-label="Descripción" onchange="A.svcSet('${s.id}','desc',this.value)">
<label class="f">Líder de servicio<select class="in" onchange="A.svcSet('${s.id}','leader',this.value)"><option value="">Sin líder</option>${db.people.slice().sort(byName).map(p=>`<option value="${p.id}" ${p.id===s.leader?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
<div class="flex flex-wrap gap-1.5">${s.members.map(id=>`<span class="chip">${esc(pnm(id))}<button type="button" aria-label="Quitar" onclick="A.svcRm('${s.id}','${id}')">${ic('x')}</button></span>`).join('')||'<span class="mut text-sm">Sin miembros</span>'}</div>
<select class="in noprint" aria-label="Sumar miembro" onchange="A.svcAddM('${s.id}',this.value)"><option value="">+ Sumar miembro…</option>${pool.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.role})</option>`).join('')}</select></div>`};
function vSvc(){const e=E();return `<div class="grid gap-5"><div class="g p-5 flex flex-wrap items-end gap-3 noprint"><form class="flex flex-wrap items-end gap-3" style="flex:1" onsubmit="return A.svcNew(event)"><label class="f" style="flex:1 1 11rem">Nuevo servicio<input class="in" name="name" required maxlength="60"></label><label class="f" style="flex:2 1 14rem">Descripción breve<input class="in" name="desc" maxlength="120"></label><button class="btn">${ic('plus')}Agregar</button></form><button type="button" class="btn x" onclick="printSvc()">${ic('printer')}Imprimir</button></div>
<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${e.svcs.map(svcCard).join('')||'<p class="mut">Sin servicios.</p>'}</div></div>`}
const printSvc=()=>printDoc('Servicios y líderes — '+E().name,tbl2(['Servicio','Descripción','Líder','Equipo'],E().svcs.map(s=>[s.name,s.desc,s.leader?pnm(s.leader):'—',s.members.map(pnm).join(', ')])));
/* --- Actividades --- */
let AF={day:'',svc:''};
const pSum=a=>{const g=k=>Object.entries(a.part).filter(([,v])=>v===k).map(([id])=>pnm(id)),row=(l,c,L)=>`<p class="text-sm"><span class="bd ${c}">${l} (${L.length})</span> ${esc(L.join(', '))||'<span class="mut">—</span>'}</p>`;return row('Participan','ok',g('si'))+row('No participan','no',g('no'))+row('Por confirmar','Abonado',g('?'))};
const psel=(a,p)=>`<select class="in" style="width:auto" aria-label="Participación de ${esc(p.name)}" onchange="A.setPart('${a.id}','${p.id}',this.value)"><option value="">Sin marcar</option>${[['si','Participa'],['no','No participa'],['?','Por confirmar']].map(([v,l])=>`<option value="${v}" ${a.part[p.id]===v?'selected':''}>${l}</option>`).join('')}</select>`;
const actCard=a=>{const sv=E().svcs.find(s=>s.id===a.svc);return `<div class="g p-4 grid gap-2 h-fit"><div class="flex items-center gap-2 flex-wrap"><b style="flex:1 1 8rem">${esc(a.name)}</b><span class="bd Abonado">${esc(a.day||'Sin día')}${a.blk?' · '+a.blk:''}</span><button type="button" class="btn no x noprint" aria-label="Eliminar actividad" onclick="A.actDel('${a.id}')">${ic('trash-2')}</button></div>
<p class="mut text-sm">${sv?'Responsable: '+esc(sv.name):'Sin servicio responsable'}${a.notes?' · '+esc(a.notes):''}</p><div id="ps${a.id}">${pSum(a)}</div>
<details class="noprint"><summary class="btn x" style="display:inline-flex">Gestionar participantes</summary><div class="grid gap-1 mt-2"><div class="flex flex-wrap gap-2"><button type="button" class="btn ok x" onclick="A.actBulk('${a.id}','team')">Equipo del servicio: participa</button><button type="button" class="btn x" onclick="A.actBulk('${a.id}','?')">Todos: por confirmar</button><button type="button" class="btn no x" onclick="A.actBulk('${a.id}','')">Limpiar</button></div><div style="max-height:18rem;overflow:auto">${SRV().map(p=>`<div class="drow"><span>${esc(p.name)} <span class="mut text-sm">${p.role}</span></span>${psel(a,p)}</div>`).join('')||'<p class="mut">No hay servidores en el directorio.</p>'}</div></div></details></div>`};
function vAct2(){const e=E(),L=dord(e.acts.filter(a=>(!AF.day||a.day===AF.day)&&(!AF.svc||a.svc===AF.svc)));
return `<div class="grid gap-5"><form class="g p-5 grid gap-3 noprint" onsubmit="return A.actNew(event)"><h3 class="h">${ic('plus')}Nueva actividad</h3><div class="r2"><label class="f">Actividad<input class="in" name="name" required maxlength="100" placeholder="Adoración, vigilia, dinámica…"></label><label class="f">Día<select class="in" name="day"><option value="">Sin día</option>${opts(DAYS)}</select></label><label class="f">Momento<select class="in" name="blk"><option value="">—</option>${opts(BLK)}</select></label><label class="f">Servicio responsable<select class="in" name="svc"><option value="">Ninguno</option>${e.svcs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label></div><label class="f">Notas<input class="in" name="notes" maxlength="300"></label><button class="btn">Agregar actividad</button></form>
<div class="g p-4 flex flex-wrap items-center gap-2 noprint"><select class="in" style="flex:1 1 8rem;width:auto" aria-label="Día" onchange="AF.day=this.value;render()"><option value="">Todos los días</option>${opts(DAYS,AF.day)}</select><select class="in" style="flex:1 1 10rem;width:auto" aria-label="Servicio" onchange="AF.svc=this.value;render()"><option value="">Todos los servicios</option>${e.svcs.map(s=>`<option value="${s.id}" ${AF.svc===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button type="button" class="btn x" onclick="printAct()">${ic('printer')}Imprimir</button></div>
<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${L.map(actCard).join('')||'<p class="mut">Aún no hay actividades con este filtro.</p>'}</div></div>`}
const printAct=()=>{const g=(a,k)=>Object.entries(a.part).filter(([,v])=>v===k).map(([id])=>pnm(id)).join(', ');printDoc('Actividades — '+E().name,tbl2(['Día','Momento','Actividad','Servicio','Participan','No participan','Por confirmar'],dord(E().acts).map(a=>[a.day,a.blk,a.name,(E().svcs.find(s=>s.id===a.svc)||{}).name||'',g(a,'si'),g(a,'no'),g(a,'?')])))};
/* --- Charlistas --- */
const chlCard=c=>{const f=(k,l,ph)=>`<label class="f">${l}<input class="in" value="${esc(c[k])}" placeholder="${ph||''}" onchange="A.chlSet('${c.id}','${k}',this.value)"></label>`;return `<div class="g p-4 grid gap-2 h-fit"><div class="flex items-center gap-2"><input class="in" style="font-weight:700" value="${esc(c.name)}" aria-label="Nombre" onchange="A.chlSet('${c.id}','name',this.value)"><button type="button" class="btn no x noprint" aria-label="Eliminar charlista" onclick="A.chlDel('${c.id}')">${ic('trash-2')}</button></div>${f('topic','Tema o charla')}<div class="r2"><label class="f">Día<select class="in" onchange="A.chlSet('${c.id}','day',this.value)"><option value="">Sin día</option>${opts(DAYS,c.day)}</select></label><label class="f">Momento<select class="in" onchange="A.chlSet('${c.id}','blk',this.value)"><option value="">—</option>${opts(BLK,c.blk)}</select></label></div>${f('phone','Contacto','Teléfono')}
<label class="f">Actividad vinculada<select class="in" onchange="A.chlSet('${c.id}','act',this.value)"><option value="">Ninguna</option>${E().acts.map(a=>`<option value="${a.id}" ${a.id===c.act?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label class="f">Requerimientos<textarea class="in" rows="2" placeholder="Proyección, sonido, habitación, dieta…" onchange="A.chlSet('${c.id}','notes',this.value)">${esc(c.notes)}</textarea></label>${c.phone?`<a class="btn ok x noprint" target="_blank" rel="noopener" href="https://wa.me/${digs(c.phone)}">${ic('phone')}WhatsApp</a>`:''}</div>`};
function vChl(){const e=E();return `<div class="grid gap-5"><form class="g p-5 flex flex-wrap items-end gap-3 noprint" onsubmit="return A.chlNew(event)"><label class="f" style="flex:1 1 11rem">Nombre<input class="in" name="name" required maxlength="80"></label><label class="f" style="flex:2 1 14rem">Tema o charla<input class="in" name="topic" maxlength="120"></label><button class="btn">${ic('plus')}Agregar charlista</button><button type="button" class="btn x" onclick="printChl()">${ic('printer')}Imprimir</button></form>
<div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${dord(e.chl).map(chlCard).join('')||'<p class="mut">Aún no hay charlistas.</p>'}</div></div>`}
const printChl=()=>printDoc('Charlistas — '+E().name,tbl2(['Día','Momento','Charlista','Tema','Contacto','Requerimientos'],dord(E().chl).map(c=>[c.day,c.blk,c.name,c.topic,c.phone,c.notes])));
/* --- Acciones --- */
const upd=(fn,msg)=>{fn();save();if(msg)logAct(msg);render()};
Object.assign(A,{
 edSw(id){db.edId=id;AF={day:'',svc:''};save();render()},
 edSet(k,v,i){const e=E();if(k==='days')e.days[i]=v;else e[k]=v.trim()||e[k];save();render()},
 edLive(k,v){const e=E();e[k]=+v;const f=$('#edfr');if(f)f.outerHTML=edFrame(e)},
 edUp(f){if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const e=E();e.img=c.toDataURL('image/jpeg',.85);e.zoom=100;e.x=50;e.y=50;save('Imagen de la edición guardada');render()};im.onerror=()=>flash('No se pudo leer la imagen');im.src=u},
 edImgDel(){upd(()=>{Object.assign(E(),{img:'',zoom:100,x:50,y:50})})},
 edNew(ev){ev.preventDefault();const f=ev.target,nm=f.name.value.trim(),n=newEd(nm,f.tag.value.trim()||nm.slice(0,20),f.inh.checked?E().svcs.map(s=>({name:s.name,desc:s.desc})):[]);db.eds.push(n);db.edId=n.id;save();logAct('Creó la edición '+nm);render();return false},
 edDel(){if(db.eds.length<2)return flash('Debe quedar al menos una edición');ask('¿Eliminar esta edición con sus servicios, actividades y charlistas? El directorio no se borra.',()=>{db.eds=db.eds.filter(x=>x.id!==db.edId);db.edId=db.eds[0].id;save();render()})},
 svcNew(ev){ev.preventDefault();const f=ev.target;upd(()=>E().svcs.push({id:uid(),name:f.name.value.trim(),desc:f.desc.value.trim(),leader:'',members:[]}),'Creó un servicio del retiro');return false},
 svcSet(id,k,v){const s=E().svcs.find(x=>x.id===id);if(s){s[k]=k==='leader'?v:(v.trim()||s[k]);save();render()}},
 svcDel(id){ask('¿Eliminar este servicio?',()=>upd(()=>{const e=E();e.svcs=e.svcs.filter(s=>s.id!==id);e.acts.forEach(a=>{if(a.svc===id)a.svc=''})}))},
 svcAddM(id,pid){const s=E().svcs.find(x=>x.id===id);if(s&&pid&&!s.members.includes(pid))upd(()=>s.members.push(pid))},
 svcRm(id,pid){const s=E().svcs.find(x=>x.id===id);if(s)upd(()=>{s.members=s.members.filter(x=>x!==pid)})},
 actNew(ev){ev.preventDefault();const f=ev.target;upd(()=>E().acts.push({id:uid(),name:f.name.value.trim(),day:f.day.value,blk:f.blk.value,svc:f.svc.value,notes:f.notes.value.trim(),part:{}}),'Creó una actividad del retiro');return false},
 actDel(id){ask('¿Eliminar esta actividad?',()=>upd(()=>{const e=E();e.acts=e.acts.filter(a=>a.id!==id);e.chl.forEach(c=>{if(c.act===id)c.act=''})}))},
 setPart(aid,pid,v){const a=E().acts.find(x=>x.id===aid);if(!a)return;if(v)a.part[pid]=v;else delete a.part[pid];save();const el=$('#ps'+aid);if(el)el.innerHTML=pSum(a)},
 actBulk(aid,k){const a=E().acts.find(x=>x.id===aid);if(!a)return;upd(()=>{if(k==='team'){const s=E().svcs.find(x=>x.id===a.svc);if(!s)return flash('Elige primero un servicio responsable');s.members.forEach(id=>{a.part[id]='si'})}else if(k==='?')SRV().forEach(p=>{if(!a.part[p.id])a.part[p.id]='?'});else a.part={}})},
 chlNew(ev){ev.preventDefault();const f=ev.target;upd(()=>E().chl.push({id:uid(),name:f.name.value.trim(),topic:f.topic.value.trim(),day:'',blk:'',phone:'',act:'',notes:''}),'Agregó un charlista');return false},
 chlSet(id,k,v){const c=E().chl.find(x=>x.id===id);if(c){c[k]=['day','blk','act'].includes(k)?v:(k==='name'?(v.trim()||c.name):v.trim());save();if(k==='phone'||k==='act')render()}},
 chlDel(id){ask('¿Eliminar este charlista?',()=>upd(()=>{const e=E();e.chl=e.chl.filter(c=>c.id!==id)}))}
});
VIEWS.splice(1,0,{id:'ed',l:'Ediciones',i:'landmark',r:vEd},{id:'svc',l:'Servicios del retiro',i:'users',r:vSvc},{id:'act2',l:'Actividades del retiro',i:'list-checks',r:vAct2},{id:'chl',l:'Charlistas',i:'user-plus',r:vChl});
document.querySelector('link[rel=icon]').href=LOGO;
try{users=cleanUsers(JSON.parse(store.get('lls-users')||'[]'))}catch(e){users=[]}
db=load()||blank();save('Autoguardado activo');DIRTY=false;
(async()=>{LIC=await verLic(store.get('lls-lic')||'',getCode());boot()})();
</script>
</body>
</html>
